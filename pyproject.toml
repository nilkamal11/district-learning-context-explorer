[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "district-learning-context-explorer"
version = "0.1.0"
description = "A reproducible, uncertainty-aware comparison of school districts serving similar communities."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Nilkamal Shah"}]
dependencies = [
  "duckdb>=1.2,<2",
  "jinja2>=3.1,<4",
  "numpy>=2,<3",
  "pandas>=2.2,<3",
  "plotly>=6,<7",
  "pyyaml>=6,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "ruff>=0.11,<1",
]

[project.scripts]
district-context = "district_context.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
district_context = ["templates/*.j2"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
